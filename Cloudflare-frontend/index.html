<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Chemistry Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px 30px;
        }

        .config-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .config-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .config-section h3 {
            color: #555;
            margin-bottom: 12px;
            margin-top: 20px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Checkbox styles */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .checkbox-item.checked {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        /* Unit accordion styles */
        .units-container {
            margin-top: 15px;
        }

        .unit-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .unit-header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .unit-header:hover {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }

        .unit-header.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .unit-title {
            font-weight: 600;
            font-size: 1.05em;
        }

        .unit-toggle {
            font-size: 1.3em;
            transition: transform 0.3s;
        }

        .unit-toggle.open {
            transform: rotate(180deg);
        }

        .unit-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .unit-content.open {
            max-height: 1000px;
        }

        .subtopics-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .subtopic-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .subtopic-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .subtopic-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .subtopic-item.checked {
            background: #e3f2fd;
            border-color: #2196f3;
        }

        .subtopic-item label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
            font-size: 0.95em;
        }

        .select-all-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9em;
            cursor: pointer;
            margin: 10px 20px;
        }

        .select-all-btn:hover {
            background: #5a6268;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .quiz-section {
            display: none;
        }

        .question-card {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            transition: all 0.3s;
        }

        .question-card:hover {
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-number {
            font-size: 1.4em;
            font-weight: bold;
            color: #667eea;
        }

        .question-badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-difficulty {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-topic {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .question-text {
            font-size: 1.15em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.05em;
        }

        .option:hover {
            background: #e3f2fd;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .option input[type="radio"] {
            width: auto;
            margin-right: 12px;
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .stats-bar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .results {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
            display: none;
        }

        .results h2 {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .results p {
            font-size: 1.3em;
            opacity: 0.9;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            font-size: 3em;
            font-weight: bold;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c33;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .grid-2, .button-group {
                grid-template-columns: 1fr;
            }

            .question-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .subtopics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AP Chemistry Quiz</h1>
            <p>Test your chemistry knowledge with practice questions</p>
        </div>

        <div class="content">
            <!-- Configuration Section -->
            <div id="config-section" class="config-section">
                <h2>Quiz Settings</h2>
                
                <div class="form-group">
                    <label>Number of Questions:</label>
                    <input type="number" id="num-questions" min="1" max="50" value="10" placeholder="Enter number (1-50)">
                </div>

                <h3>Difficulty Levels:</h3>
                <div class="checkbox-group">
                    <div class="checkbox-item" onclick="toggleCheckbox(this)">
                        <input type="checkbox" id="diff-1" value="1">
                        <label for="diff-1">Easy</label>
                    </div>
                    <div class="checkbox-item" onclick="toggleCheckbox(this)">
                        <input type="checkbox" id="diff-2" value="2">
                        <label for="diff-2">Medium</label>
                    </div>
                    <div class="checkbox-item" onclick="toggleCheckbox(this)">
                        <input type="checkbox" id="diff-3" value="3">
                        <label for="diff-3">Hard</label>
                    </div>
                </div>

                <h3>Select Topics:</h3>
                <div class="units-container" id="units-container"></div>

                <button id="start-quiz-btn" style="margin-top: 20px;">Start Quiz</button>
            </div>

            <!-- Quiz Section -->
            <div id="quiz-section" class="quiz-section">
                <div class="stats-bar">
                    <div class="stat">
                        <div class="stat-value" id="current-question">0</div>
                        <div class="stat-label">Progress</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="answered">0</div>
                        <div class="stat-label">Answered</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="total-questions">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                </div>

                <div id="questions-container"></div>

                <div class="button-group">
                    <button id="submit-btn">Submit Quiz</button>
                    <button id="new-quiz-btn">New Quiz</button>
                </div>

                <div id="results" class="results">
                    <h2>Quiz Complete! 🎉</h2>
                    <div class="score-circle" id="score-display">0/0</div>
                    <p id="score-percentage">0%</p>
                    <p id="score-message"></p>
                </div>
            </div>

            <div id="error-message"></div>
        </div>
    </div>

                    { code: '9.8', name: 'Cell Potential and Free Energy' },
                    { code: '9.9', name: 'Cell Potential Under Nonstandard Conditions' },

        // Elements
        const numQuestionsInput = document.getElementById('num-questions');
        const startQuizBtn = document.getElementById('start-quiz-btn');
        const submitBtn = document.getElementById('submit-btn');
        const newQuizBtn = document.getElementById('new-quiz-btn');
        const configSection = document.getElementById('config-section');
        const quizSection = document.getElementById('quiz-section');
        const questionsContainer = document.getElementById('questions-container');
        const resultsDiv = document.getElementById('results');
        const errorMessage = document.getElementById('error-message');
        
        let quizData = null;
        let userAnswers = {};

        // Initialize
        buildUnitsUI();

        // Build units accordion
        function buildUnitsUI() {
            const container = document.getElementById('units-container');
            
            for (let unitId in unitsData) {
                const unit = unitsData[unitId];
                const unitCard = document.createElement('div');
                unitCard.className = 'unit-card';
                
                const unitHeader = document.createElement('div');
                unitHeader.className = 'unit-header';
                unitHeader.innerHTML = `
                    <span class="unit-title">${unit.name}</span>
                    <span class="unit-toggle">▼</span>
                `;
                
                const unitContent = document.createElement('div');
                unitContent.className = 'unit-content';
                
                const selectAllBtn = document.createElement('button');
                selectAllBtn.className = 'select-all-btn';
                selectAllBtn.textContent = 'Select All';
                selectAllBtn.onclick = (e) => {
                    e.stopPropagation();
                    selectAllSubtopics(unitId);
                };
                
                const subtopicsGrid = document.createElement('div');
                subtopicsGrid.className = 'subtopics-grid';
                subtopicsGrid.id = `unit-${unitId}-subtopics`;
                
                unit.subtopics.forEach(subtopic => {
                    const subtopicItem = document.createElement('div');
                    subtopicItem.className = 'subtopic-item';
                    subtopicItem.onclick = function() { toggleCheckbox(this); };
                    
                    subtopicItem.innerHTML = `
                        <input type="checkbox" id="subtopic-${subtopic.code}" value="${subtopic.code}">
                        <label for="subtopic-${subtopic.code}">${subtopic.code} - ${subtopic.name}</label>
                    `;
                    
                    subtopicsGrid.appendChild(subtopicItem);
                });
                
                unitContent.appendChild(selectAllBtn);
                unitContent.appendChild(subtopicsGrid);
                
                unitHeader.onclick = () => toggleUnit(unitHeader, unitContent);
                
                unitCard.appendChild(unitHeader);
                unitCard.appendChild(unitContent);
                container.appendChild(unitCard);
            }
        }

        function toggleUnit(header, content) {
            const isOpen = content.classList.contains('open');
            
            if (isOpen) {
                content.classList.remove('open');
                header.classList.remove('active');
                header.querySelector('.unit-toggle').classList.remove('open');
            } else {
                content.classList.add('open');
                header.classList.add('active');
                header.querySelector('.unit-toggle').classList.add('open');
            }
        }

        function selectAllSubtopics(unitId) {
            const grid = document.getElementById(`unit-${unitId}-subtopics`);
            const checkboxes = grid.querySelectorAll('input[type="checkbox"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            
            checkboxes.forEach(cb => {
                cb.checked = !allChecked;
                const item = cb.closest('.subtopic-item');
                if (!allChecked) {
                    item.classList.add('checked');
                } else {
                    item.classList.remove('checked');
                }
            });
        }

        function toggleCheckbox(element) {
            const checkbox = element.querySelector('input[type="checkbox"]');
            checkbox.checked = !checkbox.checked;
            
            if (checkbox.checked) {
                element.classList.add('checked');
            } else {
                element.classList.remove('checked');
            }
        }

        // Get selected values
        function getSelectedDifficulties() {
            const checkboxes = document.querySelectorAll('input[id^="diff-"]:checked');
            return Array.from(checkboxes).map(cb => cb.value).join(',');
        }

        function getSelectedSubtopics() {
            const checkboxes = document.querySelectorAll('input[id^="subtopic-"]:checked');
            return Array.from(checkboxes).map(cb => cb.value).join(',');
        }

        // Start quiz
        startQuizBtn.addEventListener('click', async () => {
            const numQuestions = parseInt(numQuestionsInput.value);
            const difficulties = getSelectedDifficulties();
            const subtopics = getSelectedSubtopics();
            
            if (!numQuestions || numQuestions < 1 || numQuestions > 50) {
                showError('Please enter a valid number of questions (1-50)');
                return;
            }

            if (!difficulties) {
                showError('Please select at least one difficulty level');
                return;
            }

            if (!subtopics) {
                showError('Please select at least one topic');
                return;
            }

            await fetchQuiz(difficulties, subtopics, numQuestions);
        });

        // Submit quiz
        submitBtn.addEventListener('click', () => {
            calculateAndShowResults();
        });

        // New quiz
        newQuizBtn.addEventListener('click', () => {
            configSection.style.display = 'block';
            quizSection.style.display = 'none';
            resultsDiv.style.display = 'none';
            quizData = null;
            userAnswers = {};
            questionsContainer.innerHTML = '';
            errorMessage.innerHTML = '';
            submitBtn.disabled = false;
        });

        async function fetchQuiz(difficulties, topics, numQuestions) {
            showLoading();

            try {
                const params = new URLSearchParams({
                    difficulty: difficulties,
                    topics: topics,
                    num_questions: numQuestions,
                    sources: 'College Board'
                });

                const response = await fetch(`${WORKER_URL}/quiz?${params}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP ${response.status}: ${response.statusText}`);
                }

                quizData = await response.json();

                if (!quizData.questions || quizData.questions.length === 0) {
                    throw new Error('No questions found with the selected criteria');
                }

                displayQuiz();

            } catch (error) {
                showError('Failed to load quiz: ' + error.message);
                configSection.style.display = 'block';
                quizSection.style.display = 'none';
            }
        }

        function displayQuiz() {
            configSection.style.display = 'none';
            quizSection.style.display = 'block';
            resultsDiv.style.display = 'none';
            errorMessage.innerHTML = '';

            document.getElementById('total-questions').textContent = quizData.questions.length;
            document.getElementById('answered').textContent = '0';
            document.getElementById('current-question').textContent = '0/' + quizData.questions.length;

            questionsContainer.innerHTML = '';

            quizData.questions.forEach((question, index) => {
                const questionCard = createQuestionCard(question, index);
                questionsContainer.appendChild(questionCard);
            });
        }

        function createQuestionCard(question, index) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `question-${question.id}`;

            const questionNumber = quizData.question_id_to_number[question.id];
            const difficultyName = question.difficulty == 1 ? 'Easy' : question.difficulty == 2 ? 'Medium' : 'Hard';

            card.innerHTML = `
                <div class="question-header">
                    <div class="question-number">Question ${questionNumber}</div>
                    <div class="question-badges">
                        <span class="badge badge-difficulty">${difficultyName}</span>
                        <span class="badge badge-topic">${question.topic}</span>
                    </div>
                </div>
                <div class="question-text">${question.question_text}</div>
                <div class="options">
                    <label class="option" data-answer="a">
                        <input type="radio" name="question-${question.id}" value="a">
                        <strong>A)</strong> ${question.option_a}
                    </label>
                    <label class="option" data-answer="b">
                        <input type="radio" name="question-${question.id}" value="b">
                        <strong>B)</strong> ${question.option_b}
                    </label>
                    <label class="option" data-answer="c">
                        <input type="radio" name="question-${question.id}" value="c">
                        <strong>C)</strong> ${question.option_c}
                    </label>
                    <label class="option" data-answer="d">
                        <input type="radio" name="question-${question.id}" value="d">
                        <strong>D)</strong> ${question.option_d}
                    </label>
                </div>
            `;

            const options = card.querySelectorAll('.option');
            options.forEach(option => {
                option.addEventListener('click', () => {
                    const answer = option.dataset.answer;
                    selectAnswer(question.id, answer);
                    
                    options.forEach(opt => opt.classList.remove('selected'));
                    option.classList.add('selected');
                });
            });

            return card;
        }

        function selectAnswer(questionId, answer) {
            userAnswers[questionId] = answer;
            updateStats();
        }

        function updateStats() {
            const answered = Object.keys(userAnswers).length;
            document.getElementById('answered').textContent = answered;
            document.getElementById('current-question').textContent = `${answered}/${quizData.questions.length}`;
        }

        function calculateAndShowResults() {
            let score = 0;
            
            quizData.questions.forEach(question => {
                const userAnswer = userAnswers[question.id];
                const correctAnswer = quizData.correct_answers[question.id];
                const card = document.getElementById(`question-${question.id}`);
                const options = card.querySelectorAll('.option');

                options.forEach(option => {
                    const answer = option.dataset.answer;
                    
                    if (answer === correctAnswer) {
                        option.classList.add('correct');
                    }
                    
                    if (userAnswer && answer === userAnswer && userAnswer !== correctAnswer) {
                        option.classList.add('incorrect');
                    }
                });

                if (userAnswer === correctAnswer) {
                    score++;
                }
            });

            const total = quizData.questions.length;
            const percentage = Math.round((score / total) * 100);

            document.getElementById('score-display').textContent = `${score}/${total}`;
            document.getElementById('score-percentage').textContent = `${percentage}%`;
            
            let message = '';
            if (percentage >= 90) message = 'Outstanding! 🌟';
            else if (percentage >= 80) message = 'Excellent work! 🎉';
            else if (percentage >= 70) message = 'Good job! 👍';
            else if (percentage >= 60) message = 'Keep practicing! 📚';
            else message = 'Review the material and try again! 💪';
            
            document.getElementById('score-message').textContent = message;

            resultsDiv.style.display = 'block';
            submitBtn.disabled = true;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showLoading() {
            questionsContainer.innerHTML = '<div class="loading">Loading questions...</div>';
            configSection.style.display = 'none';
            quizSection.style.display = 'block';
        }

        function showError(message) {
            errorMessage.innerHTML = `<div class="error">${message}</div>`;
        }
    </script>
</body>
</html>
